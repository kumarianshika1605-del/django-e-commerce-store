{% extends 'base.html' %}

{% block title %}
Login
{% endblock %}

{% block content %}

<div class="auth-box">

    <h1>
        Login
    </h1>


    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <input
            type="hidden"
            name="next"
            value="{{ next }}"
        >

        <button
            type="submit"
            class="button"
        >
            Login
        </button>

    </form>


    <p>
        Don't have an account?

        <a href="{% url 'register' %}">
            Register
        </a>
    </p>

</div>

{% endblock %}
