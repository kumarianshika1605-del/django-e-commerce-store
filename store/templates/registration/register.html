{% extends 'base.html' %}

{% block title %}
Register
{% endblock %}

{% block content %}

<div class="auth-box">

    <h1>
        Create Account
    </h1>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button
            type="submit"
            class="button"
        >
            Register
        </button>

    </form>

    <p>
        Already have an account?

        <a href="{% url 'login' %}">
            Login
        </a>
    </p>

</div>

{% endblock %}
